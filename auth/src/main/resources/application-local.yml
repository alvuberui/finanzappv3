server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/authdb
    username: authuser
    password: authpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
      hibernate.show_sql: false
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

keycloak:
  base-url: http://localhost:8089
  realm: finanzapp
  # CLIENTE ADMIN (confidential, service-account enabled)
  admin-client-id: finanzapp-admin
  admin-client-secret: REEMPLAZA_ME
  # CLIENTE FRONTEND (el que usa Next.js para login)
  verify:
    client-id: finanzapp-frontend
    redirect-uri: http://localhost:3000/verified   # <- ruta en tu Next.js

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
