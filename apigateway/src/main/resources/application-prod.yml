server:
  port: 8080

spring:
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
      routes:
        - id: movement-service
          uri: http://movements:8080
          predicates:
            - Path=/movement/**

        - id: tag-service
          uri: http://tags:8080
          predicates:
            - Path=/tag/**

        - id: user-service
          uri: http://user:8080
          predicates:
            - Path=/user/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://finanzapp.ddns.net/auth/realms/finanzapp

management:
  endpoints:
    web:
      exposure:
        include: health,info
