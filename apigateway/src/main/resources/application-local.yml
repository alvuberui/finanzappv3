server:
  port: 8081

spring:
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
      routes:
        - id: movement-service
          uri: http://localhost:8082
          predicates:
            - Path=/movement/**

        - id: statistic-service
          uri: http://localhost:8083
          predicates:
            - Path=/statistic/**

        - id: tag-service
          uri: http://localhost:8084
          predicates:
            - Path=/tag/**

        - id: user-service
          uri: http://localhost:8085
          predicates:
            - Path=/user/**

        - id: auth-service
          uri: http://localhost:8086
          predicates:
            - Path=/auth/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/finanzapp

management:
  endpoints:
    web:
      exposure:
        include: health,info
