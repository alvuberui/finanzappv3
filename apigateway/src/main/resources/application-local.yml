server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: true
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
      server:
        webflux:
          routes:
            - id: movement-service
              uri: http://localhost:8082
              predicates:
                - Path=/movement/**

            - id: tag-service
              uri: http://localhost:8084
              predicates:
                - Path=/tag/**

            - id: user-service
              uri: http://localhost:8085
              predicates:
                - Path=/user/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/finanzapp

management:
  endpoints:
    web:
      exposure:
        include: health,info
