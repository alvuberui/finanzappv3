spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/userdb
    username: useruser
    password: authpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/finanzapp

server:
  port: 8085
  servlet:
    context-path: /user


