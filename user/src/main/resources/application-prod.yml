spring:
  datasource:
    url: jdbc:postgresql://postgres-user:5432/userdb
    username: useruser
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://finanzapp.ddns.net/auth/realms/finanzapp

server:
  port: 8080
  servlet:
    context-path: /user
