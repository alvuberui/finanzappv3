services:
  postgres-keycloak:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports: [ "5433:5432" ]
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    command:
      - start-dev
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    ports: [ "8080:8080" ]
    volumes:
      - ./../keycloak/themes/finanzapp:/opt/keycloak/themes/finanzapp



  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: authpass
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    ports: [ "5435:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U useruser -d userdb" ]
      interval: 5s
      timeout: 5s
      retries: 10


  postgres-movements:
    image: postgres:16
    environment:
      POSTGRES_DB: movementsdb
      POSTGRES_USER: movementsuser
      POSTGRES_PASSWORD: movementspass
    volumes:
      - postgres_movements_data:/var/lib/postgresql/data
    ports: [ "5434:5432" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movementsuser -d movementsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kcdata:
  postgres_user_data:
  postgres_movements_data:
