services:
  postgres-keycloak:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      KC_PROXY: "edge"
    command:
      - start
      - --proxy=edge
      - --http-enabled=true
      - --hostname=${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      - --hostname-strict=true
      - --http-relative-path=/auth
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ../keycloak/themes/finanzapp:/opt/keycloak/themes/finanzapp:ro
    restart: unless-stopped
    networks: [internal]
    mem_limit: 768m

  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useruser -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-movements:
    image: postgres:16
    environment:
      POSTGRES_DB: movementsdb
      POSTGRES_USER: movementsuser
      POSTGRES_PASSWORD: ${MOVEMENTS_DB_PASSWORD:?MOVEMENTS_DB_PASSWORD is required}
    volumes:
      - postgres_movements_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movementsuser -d movementsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-tags:
    image: postgres:16
    environment:
      POSTGRES_DB: tagsdb
      POSTGRES_USER: tagsuser
      POSTGRES_PASSWORD: ${TAGS_DB_PASSWORD:?TAGS_DB_PASSWORD is required}
    volumes:
      - postgres_tag_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagsuser -d tagsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  apigateway:
    build:
      context: ../apigateway
    image: finanzapp-apigateway:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    restart: unless-stopped
    networks: [internal]
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      keycloak:
        condition: service_started

  user:
    build:
      context: ../user
    image: finanzapp-user:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
    restart: unless-stopped
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      postgres-user:
        condition: service_healthy

  movements:
    build:
      context: ../movements
    image: finanzapp-movements:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      MOVEMENTS_DB_PASSWORD: ${MOVEMENTS_DB_PASSWORD:?MOVEMENTS_DB_PASSWORD is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    restart: unless-stopped
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      postgres-movements:
        condition: service_healthy

  tags:
    build:
      context: ../tags
    image: finanzapp-tags:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      TAGS_DB_PASSWORD: ${TAGS_DB_PASSWORD:?TAGS_DB_PASSWORD is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    restart: unless-stopped
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      postgres-tags:
        condition: service_healthy

volumes:
  kcdata:
  postgres_user_data:
  postgres_movements_data:
  postgres_tag_data:

networks:
  internal:
    driver: bridge
