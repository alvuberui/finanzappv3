version: "3.8"

services:
  postgres-keycloak:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KC_DB_PASSWORD:-password}"
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KC_DB_PASSWORD:-password}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    command:
      - start-dev
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./../keycloak/themes/finanzapp:/opt/keycloak/themes/finanzapp:ro
    restart: unless-stopped
    networks: [internal]
    mem_limit: 768m

  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: "${USER_DB_PASSWORD:-authpass}"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useruser -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m

  postgres-movements:
    image: postgres:16
    environment:
      POSTGRES_DB: movementsdb
      POSTGRES_USER: movementsuser
      POSTGRES_PASSWORD: "${MOV_DB_PASSWORD:-movementspass}"
    volumes:
      - postgres_movements_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movementsuser -d movementsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m

  postgres-tags:
    image: postgres:16
    environment:
      POSTGRES_DB: tagsdb
      POSTGRES_USER: tagsuser
      POSTGRES_PASSWORD: "${TAGS_DB_PASSWORD:-tagspass}"
    volumes:
      - postgres_tag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagsuser -d tagsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m

  apigateway:
    image: finanzapp-apigateway:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    restart: unless-stopped
    networks: [internal]
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      keycloak:
        condition: service_started

  user:
    image: finanzapp-user:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    restart: unless-stopped
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5

  movements:
    image: finanzapp-movements:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    restart: unless-stopped
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5

  tags:
    image: finanzapp-tags:local
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    restart: unless-stopped
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5

volumes:
  kcdata:
  postgres_user_data:
  postgres_movements_data:
  postgres_tag_data:

networks:
  internal:
    driver: bridge
