spring:
  datasource:
    url: jdbc:postgresql://postgres-movements:5432/movementsdb
    username: movementsuser
    password: ${MOVEMENTS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://finanzapp.ddns.net/auth/realms/finanzapp

server:
  port: 8080
  servlet:
    context-path: /movement

services:
  users:
    base-url: http://user:8080
  tags:
    base-url: http://tags:8080
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
