spring:
  devtools:
    restart:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5434/movementsdb
    username: movementsuser
    password: ${MOVEMENTS_DB_PASSWORD:movementspass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/finanzapp

server:
  port: 8082
  servlet:
    context-path: /movement


services:
  users:
    base-url: http://localhost:8085
  tags:
    base-url: http://localhost:8084
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
