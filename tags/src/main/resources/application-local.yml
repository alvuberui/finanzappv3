spring:
  devtools:
    restart:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5436/tagsdb
    username: tagsuser
    password: ${TAGS_DB_PASSWORD:tagspass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/finanzapp

server:
  port: 8084
  servlet:
    context-path: /tag


services:
  movements:
    base-url: http://localhost:8082
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
  tag-deletion-processor:
    fixed-delay-ms: 5000
    initial-delay-ms: 5000
