spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/tagsdb
    username: tagsuser
    password: tagspass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/finanzapp

server:
  port: 8084
  servlet:
    context-path: /tag


services:
  movements:
    base-url: http://localhost:8082
