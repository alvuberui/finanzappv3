spring:
  datasource:
    url: jdbc:postgresql://postgres-tags:5432/tagsdb
    username: tagsuser
    password: ${TAGS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://finanzapp.ddns.net/auth/realms/finanzapp

server:
  port: 8080
  servlet:
    context-path: /tag

services:
  movements:
    base-url: http://movements:8080
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  tag-deletion-processor:
    fixed-delay-ms: 5000
    initial-delay-ms: 5000
