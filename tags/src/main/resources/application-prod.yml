spring:
  datasource:
    url: jdbc:postgresql://postgres-tags:5432/tagsdb
    username: tagsuser
    password: tagspass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/finanzapp

server:
  port: 8080
  servlet:
    context-path: /tag

services:
  movements:
    base-url: http://movements:8080
